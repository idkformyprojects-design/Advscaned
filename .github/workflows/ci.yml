name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Falls back to `npm install` while the lockfile catches up with package.json
        # (the lockfile workflow commits the refreshed package-lock.json).
        run: npm ci || npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Route smoke test
        run: npm run smoke

      - name: Interaction flows
        run: npm run flows

      - name: API tests
        run: npm run server:test

      - name: App ↔ API sync test
        run: npm run test:sync

      - name: Production build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7

  firebase:
    name: Firebase rules + functions + app e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Emulator settings (test-only values)
        run: |
          printf 'ADMIN_EMAILS=admin@test.dev\nRAZORPAY_KEY_ID=rzp_test_key\nBAZAAR_FAKE_RAZORPAY=1\n' > functions/.env.local
          printf 'RAZORPAY_KEY_SECRET=rzp_test_secret\nRAZORPAY_WEBHOOK_SECRET=whsec_test\n' > functions/.secret.local

      - name: Security rules + Cloud Functions tests, then the app against them (emulators)
        run: >
          npx -y firebase-tools@latest emulators:exec
          --project demo-bazaar --only auth,firestore,functions,storage
          "npm --prefix functions test && node scripts/firebase-e2e.mjs"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships with the Android SDK; install only what AGP needs.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --version
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        # Falls back to `npm install` while the lockfile catches up with package.json
        # (the lockfile workflow commits the refreshed package-lock.json).
        run: npm ci || npm install --no-audit --no-fund

      - name: Build web bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
        run: npm run build

      - name: Sync Capacitor project
        run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          echo "### 📦 APK built" >> "$GITHUB_STEP_SUMMARY"
          ls -lh android/app/build/outputs/apk/debug/
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the **Artifacts** section of this run: \`bazaar-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
